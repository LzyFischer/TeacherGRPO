# python train_student.py --config configs/student_date_qwen.yaml
# Command-line flags override values here.
teacher_model: ckpts/date/teacher/final_lora   # output of train_teacher.py
student_model: unsloth/Qwen2.5-0.5B-Instruct
train_file: ./data/date/train.jsonl
val_file: ./data/date/test.jsonl
run_name: qwen_kl

loss_type: forward        # sft | forward | reverse | generalized
lr: 2.0e-5
batch_size: 4
num_epochs: 2
max_length: 1024

lora_r: 128
lora_alpha: 128
use_wandb: false
wandb_project: student-phase-distillation
eval_steps: 20
save_steps: 0
